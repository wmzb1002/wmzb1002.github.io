<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 MQTT 网页端</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #1e1e1e; color: #ddd; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #2d2d2d; padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #444; }
        .status-group { display: flex; gap: 20px; }
        .status { font-weight: bold; color: #f44336; }
        .status.connected { color: #4caf50; }
        .btn { padding: 8px 16px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #005bb5; }
        .btn.disconnect { background: #f44336; }
        .btn.disconnect:hover { background: #d32f2f; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .btn.read { background: #ff9800; }
        .btn.read:hover { background: #e68a00; }
        .btn.ghost { background: #555; }
        .btn.ghost:hover { background: #666; }
        .config-area { background: #252526; padding: 10px 15px; display: flex; gap: 15px; flex-wrap: wrap; border-bottom: 1px solid #444; font-size: 14px; align-items: center; }
        .config-group { display: flex; align-items: center; gap: 5px; }
        .config-area input, .config-area select { background: #3c3c3c; color: #ddd; border: 1px solid #555; padding: 5px; border-radius: 4px; }
        .config-area select { cursor: pointer; }
        .config-area input:focus { outline: none; border-color: #0066cc; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 6px; max-width: 80%; word-break: break-all; font-size: 14px; }
        .msg.received { background: #2d2d2d; align-self: flex-start; border-left: 3px solid #4caf50; }
        .msg.sent { background: #0066cc; color: white; align-self: flex-end; border-right: 3px solid #005bb5; }
        .msg.read-msg { background: #ff9800; color: white; align-self: flex-end; border-right: 3px solid #e68a00; }
        .msg.o-sent { background: #9c27b0; color: white; align-self: flex-end; border-right: 3px solid #7b1fa2; }
        .msg-time { font-size: 11px; color: #888; margin-bottom: 4px; }
        .msg.sent .msg-time, .msg.read-msg .msg-time, .msg.o-sent .msg-time { color: #e0e0e0; text-align: right; }
        .msg.system { align-self: center; background: transparent; color: #888; font-size: 12px; padding: 4px 10px; border-radius: 12px; text-align: center; border: none; }
        .input-area { background: #2d2d2d; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #444; }
        .input-area input { flex: 1; padding: 10px; border: 1px solid #555; background: #1e1e1e; color: #fff; border-radius: 4px; outline: none; }
        .input-area input:focus { border-color: #0066cc; }
        #alertModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #2d2d2d; padding: 20px; border-radius: 8px; max-width: 320px; width: 90%; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .modal-content p { margin-bottom: 15px; font-size: 14px; line-height: 1.5; color: #ddd; }
        .modal-content label { display: block; margin-bottom: 20px; font-size: 13px; color: #aaa; cursor: pointer; }
        .modal-content .btn-group { display: flex; gap: 10px; }
        .modal-content .btn-group .btn { flex: 1; }
    </style>
</head>
<body>

    <div class="header">
        <div class="status-group">
            <div>本机状态: <span id="statusText" class="status">未连接</span></div>
            <div id="peerStatusGroup">对方状态: <span id="peerStatusText" class="status">未知</span></div>
        </div>
        <div style="display:flex; gap:10px;">
            <button id="clearHistoryBtn" class="btn ghost">清空记录</button>
            <button id="connectBtn" class="btn">连接 MQTT</button>
        </div>
    </div>

    <div class="config-area">
        <div class="config-group">
            <label>模拟端: </label>
            <select id="simulateEnd">
                <option value="L" selected>L 端</option>
                <option value="C">C 端</option>
                <option value="O">O 端</option>
            </select>
        </div>
        <div class="config-group">
            <label>Host: </label>
            <input type="text" id="brokerHost" value="broker.emqx.io" size="15">
        </div>
        <div class="config-group">
            <label>Port: </label>
            <input type="number" id="brokerPort" value="8084" size="5">
        </div>
        <div class="config-group">
            <label>Path: </label>
            <input type="text" id="brokerPath" value="/mqtt" size="6">
        </div>
    </div>

    <div class="config-area" style="border-bottom: 2px solid #0066cc;">
        <div class="config-group" id="subTopicGroup">
            <label>订阅 Topic (接收): </label>
            <input type="text" id="subTopic" value="esp32/a8f3k2/c2l" size="25">
        </div>
        <div class="config-group">
            <label>发布 Topic (发送): </label>
            <input type="text" id="pubTopic" value="esp32/a8f3k2/l2c" size="25">
        </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="输入要发送给 ESP32 的消息..." disabled>
        <button id="ackReadBtn" class="btn read" disabled>发送已读</button>
        <button id="sendBtn" class="btn" disabled>发送</button>
    </div>

    <div id="alertModal">
        <div class="modal-content">
            <p>提示：您输入的文本较长（超过8个字符），可能会超出 OLED 屏幕的显示范围。</p>
            <label>
                <input type="checkbox" id="dontShowAgain"> 本次不再提示（刷新网页后恢复）
            </label>
            <div class="btn-group">
                <button id="alertCancel" class="btn" style="background:#555;">取消</button>
                <button id="alertConfirm" class="btn" style="background:#ff9800;">继续发送</button>
            </div>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('statusText');
        const peerStatusText = document.getElementById('peerStatusText');
        const peerStatusGroup = document.getElementById('peerStatusGroup');
        const connectBtn = document.getElementById('connectBtn');
        const sendBtn = document.getElementById('sendBtn');
        const ackReadBtn = document.getElementById('ackReadBtn');
        const msgInput = document.getElementById('msgInput');
        const chatBox = document.getElementById('chatBox');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        const simulateEnd = document.getElementById('simulateEnd');
        const subTopicInput = document.getElementById('subTopic');
        const subTopicGroup = document.getElementById('subTopicGroup');
        const pubTopicInput = document.getElementById('pubTopic');

        const alertModal = document.getElementById('alertModal');
        const dontShowAgain = document.getElementById('dontShowAgain');
        const alertCancel = document.getElementById('alertCancel');
        const alertConfirm = document.getElementById('alertConfirm');
        let pendingMessage = "";

        let hideWarningThisSession = false;

        let client = null;
        let isConnected = false;
        let simulateClientId = "";
        let isPeerOnline = false;
        let peerEverSeen = false;   // 是否真正收到过对方消息

        let heartbeatTimer = null;
        let peerTimeoutTimer = null;

        // ================== 聊天记录持久化 ==================
        const STORAGE_KEY = 'esp32_mqtt_chat_v1';
        const MAX_HISTORY = 300;
        const PERSIST_SYSTEM_MSG = false;

        let history = [];

        function loadHistory() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return [];
                const arr = JSON.parse(raw);
                if (!Array.isArray(arr)) return [];
                return arr.filter(r => r && typeof r.text === 'string' && typeof r.t === 'number');
            } catch (e) {
                console.warn('读取聊天记录失败:', e);
                return [];
            }
        }

        function saveHistory() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            } catch (e) {
                console.warn('保存聊天记录失败:', e);
            }
        }

        function fmtTime(ts) {
            const d = new Date(ts);
            const now = new Date();
            const p = n => String(n).padStart(2, '0');
            if (d.toDateString() === now.toDateString()) {
                return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
            }
            return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
        }

        function createMsgEl(rec) {
            const div = document.createElement('div');
            div.className = rec.sys ? 'msg system' : `msg ${rec.type}`;
            if (!rec.sys) {
                const timeDiv = document.createElement('div');
                timeDiv.className = 'msg-time';
                timeDiv.innerText = fmtTime(rec.t);
                div.appendChild(timeDiv);
            }
            const textDiv = document.createElement('div');
            textDiv.innerText = rec.text;
            div.appendChild(textDiv);
            return div;
        }

        function appendMessage(text, type = 'received', isSystem = false) {
            const rec = { t: Date.now(), text: text, type: type, sys: isSystem };
            chatBox.appendChild(createMsgEl(rec));
            chatBox.scrollTop = chatBox.scrollHeight;
            if (PERSIST_SYSTEM_MSG || !isSystem) {
                history.push(rec);
                if (history.length > MAX_HISTORY) history = history.slice(-MAX_HISTORY);
                saveHistory();
            }
        }

        function restoreHistory() {
            history = loadHistory();
            if (history.length === 0) return;
            history.forEach(rec => chatBox.appendChild(createMsgEl(rec)));
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        clearHistoryBtn.addEventListener('click', () => {
            if (!window.confirm('确定要清空本地保存的聊天记录吗？')) return;
            history = [];
            saveHistory();
            chatBox.innerHTML = '';
        });

        // ================== 在线状态（修复版） ==================
        // 从协议消息中提取发送者 clientId
        // [HEARTBEAT]CLIENT_L
        // [ACK]CLIENT_C:HB / [ACK]CLIENT_C:PIN / [ACK]CLIENT_C:MSG:xxx
        // [PIN]CLIENT_C:PIN_4_20
        function extractSenderId(msgStr) {
            if (msgStr.startsWith('[HEARTBEAT]')) {
                return msgStr.substring(11).trim() || null;
            }
            if (msgStr.startsWith('[ACK]')) {
                const rest = msgStr.substring(5);
                const colon = rest.indexOf(':');
                return (colon === -1 ? rest : rest.substring(0, colon)).trim() || null;
            }
            if (msgStr.startsWith('[PIN]')) {
                const rest = msgStr.substring(5);
                const colon = rest.indexOf(':');
                return (colon === -1 ? rest : rest.substring(0, colon)).trim() || null;
            }
            return null;
        }

        function setPeerStatus(online) {
            if (isPeerOnline === online) return;
            isPeerOnline = online;
            if (online) {
                peerEverSeen = true;
                peerStatusText.innerText = "在线";
                peerStatusText.className = "status connected";
                appendMessage("对方已上线", 'received', true);
            } else {
                peerStatusText.innerText = "离线 (超时)";
                peerStatusText.className = 'status';
                appendMessage("对方已离线 (30秒未收到消息)", 'received', true);
            }
        }

        // 连接后进入"检测中"，30 秒内没收到对方消息则显示"未检测到"
        function startPeerDetection() {
            peerEverSeen = false;
            isPeerOnline = false;
            peerStatusText.innerText = "检测中...";
            peerStatusText.className = 'status';
            clearTimeout(peerTimeoutTimer);
            peerTimeoutTimer = setTimeout(() => {
                if (!peerEverSeen) {
                    peerStatusText.innerText = "离线 (未检测到)";
                    peerStatusText.className = 'status';
                }
            }, 30000);
        }

        function resetPeerTimeout() {
            peerEverSeen = true;
            setPeerStatus(true);
            clearTimeout(peerTimeoutTimer);
            peerTimeoutTimer = setTimeout(() => setPeerStatus(false), 30000);
        }

        function sendHeartbeat() {
            if (client && isConnected && simulateEnd.value !== 'O') {
                client.publish(pubTopicInput.value.trim(), `[HEARTBEAT]${simulateClientId}`);
            }
        }

        // ================== Topic 与引脚映射 ==================
        const TOPICS = {
            L: { pub: "esp32/a8f3k2/l2c", sub: "esp32/a8f3k2/c2l" },
            C: { pub: "esp32/a8f3k2/c2l", sub: "esp32/a8f3k2/l2c" },
            O: { pub: "esp32/a8f3k2/o2all", sub: "" }
        };

        const PIN_MAP = {
            "1-3": "可以", "1-4": "不行", "1-5": "15号楼/车站", "1-6": "足球场",
            "1-7": "滑梯", "1-20": "气膜馆", "3-4": "立刻", "3-5": "30min",
            "3-6": "1h", "3-7": "2h", "3-20": "1", "4-5": "2", "4-6": "3",
            "4-7": "4", "4-20": "已读", "7-20": "检查连接状态"
        };

        simulateEnd.addEventListener('change', (e) => {
            const end = e.target.value;
            if (TOPICS[end]) {
                subTopicInput.value = TOPICS[end].sub;
                pubTopicInput.value = TOPICS[end].pub;
                if (end === 'O') {
                    subTopicGroup.style.display = 'none';
                    peerStatusGroup.style.display = 'none';
                    ackReadBtn.style.display = 'none';
                } else {
                    subTopicGroup.style.display = 'flex';
                    peerStatusGroup.style.display = 'flex';
                    ackReadBtn.style.display = 'inline-block';
                }
            }
        });

        simulateEnd.dispatchEvent(new Event('change'));

        function parsePinMessage(msg) {
            const colonIndex = msg.indexOf(':');
            if (colonIndex === -1) return msg;
            const clientId = msg.substring(5, colonIndex);
            const pairsStr = msg.substring(colonIndex + 1);
            if (pairsStr === 'none') return `${clientId}: 无引脚连接`;
            const pairs = pairsStr.split(',');
            const parsed = pairs.map(p => {
                if (p.startsWith('PIN_')) {
                    const nums = p.substring(4).replace('_', '-');
                    const mapText = PIN_MAP[nums];
                    return mapText ? `${nums}:${mapText}` : nums;
                }
                return p;
            });
            return `${clientId}: ${parsed.join(' ')}`;
        }

        // ================== 连接 ==================
        function connectMQTT() {
            const host = document.getElementById('brokerHost').value.trim();
            const port = document.getElementById('brokerPort').value.trim();
            const path = document.getElementById('brokerPath').value.trim();
            const cleanPath = path.startsWith('/') ? path : '/' + path;
            const brokerUrl = `wss://${host}:${port}${cleanPath}`;

            const targetEnd = simulateEnd.value;
            const subTopic = subTopicInput.value.trim();
            simulateClientId = `CLIENT_${targetEnd}`;

            statusText.innerText = '正在连接...';
            statusText.className = 'status';

            client = mqtt.connect(brokerUrl, {
                clientId: 'web_sim_' + targetEnd + '_' + Math.random().toString(16).substr(2, 6),
                connectTimeout: 5000,
                clean: true
            });

            client.on('connect', () => {
                isConnected = true;
                statusText.innerText = `已连接`;
                statusText.className = 'status connected';
                connectBtn.innerText = '断开连接';
                connectBtn.className = 'btn disconnect';

                msgInput.disabled = false;
                sendBtn.disabled = false;

                if (targetEnd !== 'O') {
                    ackReadBtn.disabled = false;
                    client.subscribe(subTopic, (err) => {
                        if (!err) {
                            appendMessage(`已连接，身份: ${simulateClientId}`, 'received', true);
                            // ★ 修复：不再立即 resetPeerTimeout，改为进入"检测中"
                            startPeerDetection();
                            sendHeartbeat();
                            heartbeatTimer = setInterval(sendHeartbeat, 10000);
                        }
                    });
                } else {
                    appendMessage(`已连接，身份: ${simulateClientId}`, 'received', true);
                }
            });

            client.on('message', (topic, message) => {
                const msgStr = message.toString();
                const senderId = extractSenderId(msgStr);

                // ★ 修复：忽略自己发出的消息回显，防止误判对方在线
                if (senderId && senderId === simulateClientId) return;

                // 收到对方消息 → 标记在线并重置超时
                resetPeerTimeout();

                if (msgStr.startsWith('[ACK]') || msgStr.startsWith('[HEARTBEAT]')) {
                    // 不显示
                } else if (msgStr.startsWith('[PIN]')) {
                    appendMessage(parsePinMessage(msgStr), 'received');
                } else {
                    appendMessage(msgStr, 'received');
                }

                if (msgStr.startsWith('[ACK]')) return;
                if (msgStr.startsWith('[HEARTBEAT]')) {
                    client.publish(pubTopicInput.value.trim(), `[ACK]${simulateClientId}:HB`);
                    return;
                }
                if (msgStr.startsWith('[PIN]')) {
                    client.publish(pubTopicInput.value.trim(), `[ACK]${simulateClientId}:PIN`);
                    return;
                }
                let preview = msgStr.substring(0, 20);
                client.publish(pubTopicInput.value.trim(), `[ACK]${simulateClientId}:MSG:${preview}`);
            });

            client.on('error', () => { statusText.innerText = '连接错误'; });
            client.on('close', () => { cleanup(); });
        }

        function disconnectMQTT() { if (client) client.end(); }

        function cleanup() {
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            if (peerTimeoutTimer) clearTimeout(peerTimeoutTimer);

            isConnected = false;
            isPeerOnline = false;
            peerEverSeen = false;
            statusText.innerText = '未连接';
            statusText.className = 'status';
            peerStatusText.innerText = '未知';
            peerStatusText.className = 'status';

            connectBtn.innerText = '连接 MQTT';
            connectBtn.className = 'btn';
            msgInput.disabled = true;
            sendBtn.disabled = true;
            ackReadBtn.disabled = true;

            if (client) client = null;
            appendMessage("连接已断开", 'received', true);
        }

        connectBtn.addEventListener('click', () => {
            if (isConnected) disconnectMQTT();
            else connectMQTT();
        });

        ackReadBtn.addEventListener('click', () => {
            if (client && isConnected) {
                const msg = `[PIN]${simulateClientId}:PIN_4_20`;
                client.publish(pubTopicInput.value.trim(), msg);
                appendMessage(parsePinMessage(msg), 'read-msg');
            }
        });

        function executeSend(text, pubTopic) {
            client.publish(pubTopic, text);
            if (simulateEnd.value === 'O') {
                appendMessage(`[O端广播] ${text}`, 'o-sent');
            } else {
                appendMessage(text, 'sent');
            }
            msgInput.value = '';
        }

        sendBtn.addEventListener('click', () => {
            const text = msgInput.value.trim();
            const pubTopic = pubTopicInput.value.trim();
            if (!text || !client || !isConnected) return;

            if (simulateEnd.value === 'O' && text.length > 8 && !hideWarningThisSession) {
                pendingMessage = text;
                dontShowAgain.checked = false;
                alertModal.style.display = 'flex';
            } else {
                executeSend(text, pubTopic);
            }
        });

        alertCancel.addEventListener('click', () => {
            alertModal.style.display = 'none';
            pendingMessage = "";
        });

        alertConfirm.addEventListener('click', () => {
            if (dontShowAgain.checked) hideWarningThisSession = true;
            alertModal.style.display = 'none';
            if (pendingMessage) {
                executeSend(pendingMessage, pubTopicInput.value.trim());
                pendingMessage = "";
            }
        });

        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

        restoreHistory();
    </script>
</body>
</html>
